# Local .mediastack.lab domain routing (port-free access)
#
# How it works:
# 1. Pi-hole DNS resolves *.mediastack.lab → TRAEFIK_LAN_IP (macvlan, e.g. 10.10.0.11)
# 2. Browser requests http://sonarr.mediastack.lab → Traefik on port 80 (macvlan IP)
# 3. Traefik matches Host header → routes to correct service:port
#
# Result: http://sonarr.mediastack.lab instead of http://10.10.0.10:8989
#
# Note: Requires Traefik macvlan setup (see docs/LOCAL-DNS.md)

http:
  routers:
    # === Media Services ===
    plex-lan:
      rule: "Host(`plex.mediastack.lab`)"
      entryPoints: [web, websecure]
      service: plex-lan

    plex-plain-lan:
      rule: "Host(`plex`)"
      entryPoints: [web, websecure]
      service: plex-lan

    seerr-lan:
      rule: "Host(`seerr.mediastack.lab`)"
      entryPoints: [web, websecure]
      service: seerr-lan

    agregarr-lan:
      rule: "Host(`agregarr.mediastack.lab`)"
      entryPoints: [web, websecure]
      service: agregarr-lan

    tautulli-lan:
      rule: "Host(`tautulli.mediastack.lab`)"
      entryPoints: [web, websecure]
      service: tautulli-lan

    # === *arr Stack (VPN-protected via Gluetun) ===
    sonarr-lan:
      rule: "Host(`sonarr.mediastack.lab`)"
      entryPoints: [web, websecure]
      service: sonarr-lan

    radarr-lan:
      rule: "Host(`radarr.mediastack.lab`)"
      entryPoints: [web, websecure]
      service: radarr-lan

    prowlarr-lan:
      rule: "Host(`prowlarr.mediastack.lab`)"
      entryPoints: [web, websecure]
      service: prowlarr-lan

    bazarr-lan:
      rule: "Host(`bazarr.mediastack.lab`)"
      entryPoints: [web, websecure]
      service: bazarr-lan

    lidarr-lan:
      rule: "Host(`lidarr.mediastack.lab`)"
      entryPoints: [web, websecure]
      service: lidarr-lan

    slskd-lan:
      rule: "Host(`slskd.mediastack.lab`)"
      entryPoints: [web, websecure]
      service: slskd-lan

    slskarr-lan:
      rule: "Host(`slskarr.mediastack.lab`)"
      entryPoints: [web, websecure]
      service: slskarr-lan

    chaptarr-lan:
      rule: "Host(`chaptarr.mediastack.lab`)"
      entryPoints: [web, websecure]
      service: chaptarr-lan

    calibre-server-lan:
      rule: "Host(`calibre-server.mediastack.lab`)"
      entryPoints: [web, websecure]
      service: calibre-server-lan

    # === Download Clients ===
    qbit-lan:
      rule: "Host(`qbit.mediastack.lab`)"
      entryPoints: [web, websecure]
      service: qbit-lan

    # === Infrastructure ===
    traefik-lan:
      rule: "Host(`traefik.mediastack.lab`)"
      entryPoints: [web, websecure]
      service: api@internal

    # === Utilities ===
    uptime-lan:
      rule: "Host(`uptime.mediastack.lab`)"
      entryPoints: [web, websecure]
      service: uptime-lan

    duc-lan:
      rule: "Host(`duc.mediastack.lab`)"
      entryPoints: [web, websecure]
      service: duc-lan

    beszel-lan:
      rule: "Host(`beszel.mediastack.lab`)"
      entryPoints: [web, websecure]
      service: beszel-lan

    whoami-lan:
      rule: "Host(`whoami.mediastack.lab`)"
      entryPoints: [web, websecure]
      service: whoami-lan

  services:
    # === Media Services ===
    plex-lan:
      loadBalancer:
        servers:
          - url: 'http://{{ env "PLEX_LAN_IP" }}:32400'

    seerr-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.8:5055"

    agregarr-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.11:7171"

    tautulli-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.12:8181"

    # === *arr Stack (via Gluetun at 172.20.0.3) ===
    sonarr-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.3:8989"

    radarr-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.3:7878"

    prowlarr-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.3:9696"

    lidarr-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.3:8686"

    slskd-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.3:5030"

    chaptarr-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.3:8789"

    calibre-server-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.18:8080"

    bazarr-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.9:6767"

    # === Download Clients (via Gluetun) ===
    qbit-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.3:8085"

    slskarr-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.3:8080"

    # === Utilities ===
    uptime-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.13:3001"

    duc-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.14:80"

    beszel-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.15:8090"

    whoami-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.16:80"
          
